<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="根据身体信息、活动量和目标估算每日营养需求并生成一日食谱。" />
  <title>今日食养 · 每日食谱推荐</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">DAILY NOURISHMENT</p>
        <h1>吃得刚刚好，<br /><em>每一天。</em></h1>
        <p class="hero-copy">用你的身体数据和生活节奏，估算每日所需，并生成份量清晰、营养均衡的一日食谱。</p>
      </div>
      <div class="hero-mark" aria-hidden="true"><span>食</span></div>
    </header>

    <section class="workspace">
      <form id="profile-form" class="profile-card">
        <div class="section-heading">
          <span>01</span>
          <div><h2>认识你</h2><p>112 道菜谱智能轮换</p></div>
        </div>

        <div class="field-grid">
          <label>身高 <span>cm</span><input id="height" type="number" min="130" max="220" value="170" required /></label>
          <label>体重 <span>kg</span><input id="weight" type="number" min="35" max="250" step="0.1" value="65" required /></label>
          <label>年龄 <span>岁</span><input id="age" type="number" min="18" max="80" value="28" required /></label>
          <label>生理性别
            <select id="sex" required><option value="female">女</option><option value="male">男</option></select>
          </label>
        </div>

        <fieldset>
          <legend>日常活动量</legend>
          <div class="choice-row" id="activity-choices">
            <label><input type="radio" name="activity" value="1.2" checked /><span><b>久坐</b><small>很少运动</small></span></label>
            <label><input type="radio" name="activity" value="1.375" /><span><b>轻度</b><small>每周 1–3 次</small></span></label>
            <label><input type="radio" name="activity" value="1.55" /><span><b>中度</b><small>每周 3–5 次</small></span></label>
            <label><input type="radio" name="activity" value="1.725" /><span><b>高强度</b><small>每周 6–7 次</small></span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>当前目标</legend>
          <div class="goal-row">
            <label><input type="radio" name="goal" value="lose" /><span>温和减脂<small>约 −15%</small></span></label>
            <label><input type="radio" name="goal" value="maintain" checked /><span>保持体重<small>维持平衡</small></span></label>
            <label><input type="radio" name="goal" value="gain" /><span>稳步增重<small>约 +10%</small></span></label>
          </div>
        </fieldset>

        <div id="form-error" class="form-error" role="alert"></div>
        <button class="primary-button" type="submit">生成今日食谱 <span>→</span></button>
        <p class="privacy-note">所有计算均在本地完成，不会上传你的数据。</p>
      </form>

      <section id="results" class="results" aria-live="polite">
        <div class="empty-state">
          <div class="plate" aria-hidden="true"><span>🥬</span></div>
          <h2>你的今日餐桌，正在等你</h2>
          <p>填写左侧信息后，这里会出现专属营养目标和一日食谱。</p>
        </div>
      </section>
    </section>

    <div id="recipe-modal" class="recipe-modal" aria-hidden="true">
      <div class="recipe-backdrop" data-close-recipe></div>
      <section class="recipe-panel" role="dialog" aria-modal="true" aria-labelledby="recipe-title">
        <button class="recipe-close" type="button" data-close-recipe aria-label="关闭详细做法">×</button>
        <div class="recipe-detail-head">
          <span id="recipe-detail-icon" class="recipe-detail-icon" aria-hidden="true"></span>
          <div>
            <p id="recipe-detail-meta" class="recipe-detail-meta"></p>
            <h2 id="recipe-title"></h2>
          </div>
        </div>
        <div class="recipe-detail-grid">
          <section>
            <h3>所需食材</h3>
            <ul id="recipe-ingredients" class="ingredient-list"></ul>
          </section>
          <section>
            <h3>详细做法</h3>
            <ol id="recipe-steps" class="step-list"></ol>
          </section>
        </div>
        <p id="recipe-tip" class="recipe-tip"></p>
      </section>
    </div>

    <footer>
      <p>营养估算仅供一般健康管理参考，不替代医生或注册营养师建议。孕期、哺乳期、未成年人、运动员或患有代谢/消化疾病者请先咨询专业人士。</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
